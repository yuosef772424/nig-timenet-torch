name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tests/test_cards.py diffs against the PR base (rule B7)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # matches crypto-signal-prediction's CI (requirements-ci.txt header)
      - name: Install (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.15.0+cpu"
          pip install -e ".[dev,data]"
      - name: Navigation map is fresh
        run: python -m tests.build_map --check
      - name: Pin changes are documented (rule B1)
        if: github.event_name == 'pull_request'
        run: python -m tests.pin_diff origin/${{ github.base_ref }}
      - name: Decision numbers not taken by an unmerged branch (warning only)
        if: github.event_name == 'pull_request'
        run: python -m tools.decision_clash --base origin/${{ github.base_ref }}
      - name: PR description has valid Friction and Suggestions sections
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}   # untrusted text: through the environment, never the shell
        run: python -m tools.check_pr_sections
      # `python -m tools.close_step --check` is NOT a separate step: CI already covers each of its parts (MAP above,
      # pin_diff above incl. the TODO-in-a-decision check, the pin tests and tests/test_decisions.py in the test step,
      # the STATUS length in tests/test_docs_claims.py). It exists for the session's local run before pushing.
      - name: Lint
        run: ruff check src tests tools
      - name: Test (fast + slow; time budget of rule E3 enforced by tests/conftest.py)
        env:
          CARD_REQUIRE_BASE: "1"   # a missing PR base fails test_cards instead of skipping
          CARD_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before || '') }}
        run: pytest -q -m "slow or not slow" --durations=10
