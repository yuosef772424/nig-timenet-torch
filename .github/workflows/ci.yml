name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tests/test_cards.py diffs against the PR base (rule B7)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # matches crypto-signal-prediction's CI (requirements-ci.txt header)
      - name: Install (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.15.0+cpu"
          pip install -e ".[dev,data]"
      - name: Navigation map is fresh
        run: python -m tests.build_map --check
      - name: Lint
        run: ruff check src tests
      - name: Test (fast + slow; time budget of rule E3 enforced by tests/conftest.py)
        env:
          CARD_REQUIRE_BASE: "1"   # a missing PR base fails test_cards instead of skipping
          CARD_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before || '') }}
        run: pytest -q -m "slow or not slow" --durations=10
